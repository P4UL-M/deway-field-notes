<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName analytics.blog.deway.fr

    ProxyPreserveHost On
    ProxyRequests Off

    # Authentication is handled by Umami itself. Adding Apache Basic Auth here
    # prevents the dashboard from calling its own /api endpoints reliably.
    ProxyPass        / http://127.0.0.1:8111/
    ProxyPassReverse / http://127.0.0.1:8111/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog ${APACHE_LOG_DIR}/analytics.blog.deway.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/analytics.blog.deway.fr-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/analytics.blog.deway.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/analytics.blog.deway.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
