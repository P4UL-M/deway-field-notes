<VirtualHost *:80>
    ServerName blog.deway.fr

    ProxyPreserveHost On
    ProxyRequests Off

    # First-party Umami collection stays public for visitors. The dashboard is
    # exposed separately, with authentication, on analytics.blog.deway.fr.
    ProxyPass        /insight.js http://127.0.0.1:8111/insight.js
    ProxyPassReverse /insight.js http://127.0.0.1:8111/insight.js
    ProxyPass        /api/event http://127.0.0.1:8111/api/event
    ProxyPassReverse /api/event http://127.0.0.1:8111/api/event

    ProxyPass        / http://127.0.0.1:8110/
    ProxyPassReverse / http://127.0.0.1:8110/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ErrorLog ${APACHE_LOG_DIR}/blog.deway.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/blog.deway.fr-access.log combined
</VirtualHost>
