<VirtualHost *:80>
    ServerName analytics.blog.deway.fr

    ProxyPreserveHost On
    ProxyRequests Off

    # Umami provides its own authenticated dashboard. Do not add Apache Basic
    # Auth here: the dashboard's fetch requests do not consistently reuse that
    # challenge and /api/config plus /api/auth/verify end up in a 401 loop.

    ProxyPass        / http://127.0.0.1:8111/
    ProxyPassReverse / http://127.0.0.1:8111/

    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    RequestHeader set X-Forwarded-Port "expr=%{SERVER_PORT}"

    ErrorLog ${APACHE_LOG_DIR}/analytics.blog.deway.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/analytics.blog.deway.fr-access.log combined
</VirtualHost>
