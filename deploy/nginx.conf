# Keep PDF downloads out of search results, including conditional responses
# without a Content-Type. Leave crawling allowed so engines can read noindex.
map $uri $pdf_path_robots_tag {
    default "";
    ~*\.pdf$ noindex;
}

map $upstream_http_content_type $pdf_robots_tag {
    default $pdf_path_robots_tag;
    "~*^application/pdf(?:;|$)" noindex;
}

server {
    listen 80;
    server_name _;

    charset utf-8;
    server_tokens off;

    add_header X-Robots-Tag $pdf_robots_tag always;

    location ^~ /admin {
        proxy_pass http://payload:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /api {
        proxy_pass http://payload:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100m;
    }

    location ^~ /_next {
        proxy_pass http://payload:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://astro:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
